<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <!-- Prevent theme flash script -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo" id="my-name">Portfolio</div>
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Toggle Menu">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="menu-overlay" id="menu-overlay"></div>
            <nav class="nav-links" id="nav-links">
                <a href="#work" class="nav-link">Work</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#contact" class="nav-link">Contact</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Theme">🌙</button>
            </nav>
        </header>

        <!-- Hero Section -->
        <section class="section hero fade-in">
            <h2 id="my-role" style="font-weight: 500; margin-bottom: var(--space-sm); color: var(--accent-color);">Creative Developer</h2>
            <h1 id="my-tagline">I build clean, minimalist, and engaging digital experiences.</h1>
        </section>

        <!-- Work Section -->
        <section id="work" class="section">
            <h2 class="fade-in">Featured Work</h2>
            <div id="projects-grid" class="projects-grid">
                <!-- Projects will be injected here via main.js -->
            </div>
        </section>

        <!-- About Section -->
        <section id="about" class="section fade-in">
            <h2>About Me</h2>
            <div style="max-width: 800px;">
                <p id="my-about" style="font-size: 1.1rem; color: var(--text-muted);"></p>
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section fade-in">
            <h2>Get In Touch</h2>
            <form id="contact-form" class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" required placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" rows="5" required placeholder="How can we work together?"></textarea>
                </div>
                <button type="submit">Send Message</button>
            </form>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; <span id="year"></span> <span id="footer-name"></span>. Built with minimalistic design in mind.</p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="data.js"></script>
    <script src="main.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        setTimeout(() => {
            const nameEl = document.getElementById('my-name');
            if (nameEl) document.getElementById('footer-name').textContent = nameEl.textContent;
        }, 100);
    </script>
</body>
</html>
